<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assets · PortoHR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>
  </head>
  <body class="invisible h-full bg-slate-50 font-sans text-slate-900 antialiased">
    <main class="px-4 pb-12 pt-24 sm:px-6 lg:pl-72 lg:pr-8">
      <div class="mx-auto max-w-7xl">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight">Assets &amp; facilities</h1>
            <p class="mt-1 text-sm text-slate-500">
              Catalogue, custody and workplace services. Separation queues recovery — it does not write off the kit.
            </p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="open-request" type="button" class="rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
              Request
            </button>
            <button id="open-scan" type="button" class="hidden rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
              Scan barcode
            </button>
            <button id="open-issue" type="button" class="hidden rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
              Issue
            </button>
            <button id="open-asset" type="button" class="hidden rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
              Add asset
            </button>
            <button id="export-file" type="button" class="hidden rounded-lg bg-[#2054C9] px-4 py-2.5 text-sm font-semibold text-white hover:bg-[#173F9C]">
              Finance export
            </button>
          </div>
        </div>

        <div id="asset-tabs" class="mt-8 flex flex-wrap gap-2 border-b border-slate-200">
          <button type="button" data-tab="mine" class="tab-btn -mb-px border-b-2 border-[#2054C9] px-3 py-2 text-sm font-semibold text-slate-900">My assets</button>
          <button type="button" data-tab="register" class="tab-btn hidden -mb-px border-b-2 border-transparent px-3 py-2 text-sm font-medium text-slate-500">Register</button>
          <button type="button" data-tab="recovery" class="tab-btn hidden -mb-px border-b-2 border-transparent px-3 py-2 text-sm font-medium text-slate-500">Recovery</button>
          <button type="button" data-tab="facilities" class="tab-btn -mb-px border-b-2 border-transparent px-3 py-2 text-sm font-medium text-slate-500">Facilities</button>
          <button type="button" data-tab="maintenance" class="tab-btn -mb-px border-b-2 border-transparent px-3 py-2 text-sm font-medium text-slate-500">Maintenance</button>
        </div>

        <section id="tab-mine" class="mt-6">
          <div id="mine-list"></div>
        </section>
        <section id="tab-register" class="mt-6 hidden">
          <div id="register-list"></div>
        </section>
        <section id="tab-recovery" class="mt-6 hidden">
          <div id="recovery-list"></div>
        </section>
        <section id="tab-facilities" class="mt-6 hidden space-y-10">
          <div id="route-list"></div>
          <div id="room-list"></div>
        </section>
        <section id="tab-maintenance" class="mt-6 hidden">
          <div id="job-list"></div>
        </section>
      </div>
    </main>

    <div id="panel-backdrop" class="fixed inset-0 z-40 hidden bg-slate-900/40"></div>
    <aside id="side-panel" class="fixed inset-y-0 right-0 z-50 w-full max-w-md translate-x-full overflow-y-auto border-l border-slate-200 bg-white p-6 shadow-xl transition-transform duration-200">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 id="panel-title" class="text-lg font-semibold text-slate-900">—</h2>
          <p id="panel-sub" class="mt-1 text-sm text-slate-500"></p>
        </div>
        <button id="panel-close" type="button" class="rounded-lg p-2 text-slate-400 hover:bg-slate-100" aria-label="Close">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <div id="panel-body" class="mt-6"></div>
    </aside>

    <div id="toasts" class="pointer-events-none fixed bottom-6 right-6 z-[60] flex w-80 flex-col gap-2"></div>

    <script src="/js/api.js"></script>
    <script src="/js/shell.js"></script>
    <script src="/js/assets.js"></script>
  </body>
</html>
