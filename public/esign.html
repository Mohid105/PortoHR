<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-sign · PortoHR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/tailwind.css?v=20261009-0452" />
    <link id="portohr-theme-css" rel="stylesheet" href="/css/theme.css?v=20261009-0452" />
    <script src="/js/theme-early.js?v=20261009-0452"></script>
  </head>
  <body class="invisible h-full bg-slate-50 font-sans text-slate-900 antialiased">
    <main class="px-4 pb-12 pt-24 sm:px-6 lg:pl-72 lg:pr-8">
      <div class="mx-auto max-w-7xl">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">E-sign</h1>
          <p id="page-subtitle" class="mt-1 text-sm text-slate-500">
            Documents frozen at send time. A signature is evidence of consent — it does not change Core HR or payroll.
          </p>
        </div>

        <div id="esign-tabs" class="mt-8 flex flex-wrap gap-2 border-b border-slate-200">
          <button type="button" data-tab="mine" class="tab-btn -mb-px border-b-2 border-[#2054C9] px-3 py-2 text-sm font-semibold text-slate-900">To sign</button>
          <button type="button" data-tab="done" class="tab-btn -mb-px border-b-2 border-transparent px-3 py-2 text-sm font-medium text-slate-500">Signed &amp; closed</button>
          <button type="button" data-tab="send" class="tab-btn hidden -mb-px border-b-2 border-transparent px-3 py-2 text-sm font-medium text-slate-500">Send pack</button>
        </div>

        <section id="tab-mine" class="mt-6">
          <div id="mine-list"></div>
        </section>
        <section id="tab-done" class="mt-6 hidden">
          <div id="done-list"></div>
        </section>
        <section id="tab-send" class="mt-6 hidden">
          <form id="send-form" class="grid max-w-3xl gap-4 rounded-xl border border-slate-200 bg-white p-5 shadow-card sm:grid-cols-2">
            <label class="text-sm">
              <span class="block text-xs font-medium text-slate-500">Employee</span>
              <select id="send-employee" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" required></select>
            </label>
            <label class="text-sm">
              <span class="block text-xs font-medium text-slate-500">Kind</span>
              <select id="send-kind" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></select>
            </label>
            <label class="text-sm sm:col-span-2">
              <span class="block text-xs font-medium text-slate-500">Title</span>
              <input id="send-title" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" required maxlength="160" placeholder="Employment contract addendum" />
            </label>
            <label class="text-sm">
              <span class="block text-xs font-medium text-slate-500">Due (optional)</span>
              <input id="send-due" type="date" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
            </label>
            <p class="self-end text-xs text-slate-500">The text below is hashed when you send. Later edits are impossible.</p>
            <label class="text-sm sm:col-span-2">
              <span class="block text-xs font-medium text-slate-500">Document text</span>
              <textarea id="send-body" rows="8" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" required maxlength="8000" placeholder="Paste the letter the employee must accept."></textarea>
            </label>
            <div class="sm:col-span-2">
              <button type="submit" class="rounded-lg bg-[#2054C9] px-4 py-2 text-sm font-semibold text-white hover:bg-[#173F9C]">Send — freeze and notify</button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <div id="panel-backdrop" class="fixed inset-0 z-40 hidden bg-slate-900/40"></div>
    <aside id="side-panel" class="fixed inset-y-0 right-0 z-50 w-full max-w-lg translate-x-full overflow-y-auto border-l border-slate-200 bg-white p-6 shadow-xl transition-transform duration-200">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 id="panel-title" class="text-lg font-semibold text-slate-900">—</h2>
          <p id="panel-sub" class="mt-1 text-sm text-slate-500"></p>
        </div>
        <button id="panel-close" type="button" class="rounded-lg p-2 text-slate-400 hover:bg-slate-100" aria-label="Close">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div id="panel-body" class="mt-6"></div>
    </aside>

    <div id="confirm-backdrop" class="fixed inset-0 z-[60] hidden bg-slate-900/40">
      <div class="flex min-h-full items-center justify-center p-4">
        <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl" role="dialog" aria-modal="true">
          <h3 id="confirm-title" class="text-base font-semibold text-slate-900">Are you sure?</h3>
          <p id="confirm-text" class="mt-2 text-sm text-slate-600"></p>
          <div class="mt-6 flex justify-end gap-2">
            <button id="confirm-cancel" type="button" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700">Cancel</button>
            <button id="confirm-ok" type="button" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white">Confirm</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toasts" class="pointer-events-none fixed bottom-6 right-6 z-[70] flex w-80 flex-col gap-2"></div>

    <script src="/js/api.js?v=20261009-0452"></script>
    <script src="/js/shell.js?v=20261009-0452"></script>
    <script src="/js/esign.js?v=20261009-0452"></script>
  </body>
</html>
