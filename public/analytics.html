<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics · PortoHR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>
  </head>
  <body class="invisible h-full bg-slate-50 font-sans text-slate-900 antialiased">
    <main class="px-4 pb-12 pt-24 sm:px-6 lg:pl-72 lg:pr-8">
      <div class="mx-auto max-w-7xl">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight">Analytics</h1>
            <p class="mt-1 text-sm text-slate-500">
              Live, role-scoped numbers from Core HR — not a warehouse. Outlook scores are published rules, not a model.
            </p>
          </div>
          <button id="refresh-kpi" type="button" class="hidden rounded-lg bg-[#2054C9] px-4 py-2.5 text-sm font-semibold text-white hover:bg-[#173F9C]">
            Refresh KPI snapshot
          </button>
        </div>

        <div id="an-tabs" class="mt-8 flex flex-wrap gap-2 border-b border-slate-200">
          <button type="button" data-tab="overview" class="tab-btn -mb-px border-b-2 border-[#2054C9] px-3 py-2 text-sm font-semibold text-slate-900">Overview</button>
          <button type="button" data-tab="headcount" class="tab-btn -mb-px border-b-2 border-transparent px-3 py-2 text-sm font-medium text-slate-500">Headcount</button>
          <button type="button" data-tab="quality" class="tab-btn -mb-px border-b-2 border-transparent px-3 py-2 text-sm font-medium text-slate-500">Data quality</button>
          <button type="button" data-tab="outlook" class="tab-btn -mb-px border-b-2 border-transparent px-3 py-2 text-sm font-medium text-slate-500">Outlook</button>
          <button type="button" data-tab="reports" class="tab-btn -mb-px border-b-2 border-transparent px-3 py-2 text-sm font-medium text-slate-500">Reports</button>
          <button type="button" data-tab="snapshots" class="tab-btn hidden -mb-px border-b-2 border-transparent px-3 py-2 text-sm font-medium text-slate-500">Snapshots</button>
        </div>

        <section id="tab-overview" class="mt-6">
          <div id="overview-board"></div>
        </section>
        <section id="tab-headcount" class="mt-6 hidden">
          <form id="asof-form" class="mb-4 flex flex-wrap items-end gap-3">
            <label class="text-sm">
              <span class="block text-xs font-medium text-slate-500">As of</span>
              <input id="asof-date" type="date" class="mt-1 rounded-lg border border-slate-300 px-3 py-2 text-sm" />
            </label>
            <button type="submit" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold hover:bg-slate-50">Apply</button>
          </form>
          <div id="headcount-board"></div>
        </section>
        <section id="tab-quality" class="mt-6 hidden">
          <div id="quality-board"></div>
        </section>
        <section id="tab-outlook" class="mt-6 hidden">
          <div id="outlook-board"></div>
        </section>
        <section id="tab-reports" class="mt-6 hidden">
          <div id="reports-board"></div>
        </section>
        <section id="tab-snapshots" class="mt-6 hidden space-y-8">
          <div id="snapshot-list"></div>
          <div id="export-list"></div>
        </section>
      </div>
    </main>

    <div id="toasts" class="pointer-events-none fixed bottom-6 right-6 z-[60] flex w-80 flex-col gap-2"></div>

    <script src="/js/api.js"></script>
    <script src="/js/shell.js"></script>
    <script src="/js/analytics.js"></script>
  </body>
</html>
